[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-navigation-benchmark"
version = "0.1.0"
description = "Offline UAV navigation metrics with an optional DiffPhysDrone adapter"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
uav-benchmark = "uav_benchmark.cli:main"

[tool.setuptools.packages.find]
include = ["uav_benchmark*"]
